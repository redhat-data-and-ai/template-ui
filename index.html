<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // FOUC prevention: apply theme class before first paint.
    // Mirrors resolveInitialTheme/themeStorageKey (src/frontend/lib/theme-storage.ts, app-paths.ts).
    (function() {
      var dark = false;
      try {
        var parts = [];
        var basePath = window.APP_DATA && window.APP_DATA.basePath;
        if (basePath && basePath !== '/') {
          parts = basePath.replace(/^\/|\/$/g, '').split('/');
        }
        if (parts.length < 2) {
          parts = location.pathname.split('/').filter(Boolean);
        }
        var scope = parts.length >= 2 ? parts[0] + '/' + parts[1] : '';
        var key = scope ? 'template-ui-theme:' + scope : 'template-ui-theme';
        var stored = localStorage.getItem(key);
        dark = stored === 'dark' || stored === 'light'
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) {}
      document.documentElement.classList.toggle('pf-v6-theme-dark', dark);
    })();
  </script>
  <title>Template UI</title>
</head>
