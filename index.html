<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // FOUC prevention: apply theme classes before first paint
    (function() {
      try {
        var stored = localStorage.getItem('template-ui-settings');
        var theme = stored ? JSON.parse(stored).theme || 'dark' : 'dark';
      } catch(e) {
        var theme = 'dark';
      }
      var html = document.documentElement;
      if (theme === 'dark') {
        html.classList.add('dark', 'pf-v6-theme-dark');
      } else {
        html.classList.remove('dark', 'pf-v6-theme-dark');
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Template UI</title>
</head>
