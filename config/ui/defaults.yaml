# Default configuration for template-ui
# This file defines the default branding, features, and agent settings
# Deployed instances can override via config/ui/settings.yaml

branding:
  logo_url: "/logo.svg"
  title: "Deep Agent"
  favicon_url: "/favicon.ico"
  colors:
    light:
      primary: "#0066cc"       # Blue
      accent: "#a60000"        # Red accent
      background: "#ffffff"    # White
      foreground: "#1a1a1a"    # Near black
    dark:
      primary: "#4dabf7"       # Light blue
      accent: "#f56e6e"        # Light red
      background: "#0a1628"    # Navy slate
      foreground: "#f0f4f8"    # Off white

features:
  # Default values for user settings - users can still toggle these in UI
  debug_mode_default: false
  # Auth configuration - replaces AUTH_ENABLED env var
  auth_enabled: true

agent:
  # Empty endpoint means use AGENT_HOST env var
  endpoint: ""
  timeout_ms: 30000
  streaming: true

# Existing configuration sections
server:
  host: "0.0.0.0"
  port: 8080
  body_limit: 1048576

logging:
  level: "info"

cors:
  origin: "http://localhost:5173"

security:
  helmet:
    enabled: true
    csp:
      default_src: ["'self'"]
      script_src: ["'self'", "'unsafe-inline'"]
      style_src: ["'self'", "'unsafe-inline'"]
      img_src: ["'self'", "data:", "blob:"]
      connect_src: ["'self'"]
      font_src: ["'self'", "data:"]
      object_src: ["'none'"]
      frame_ancestors: ["'none'"]
    cross_origin_embedder_policy: false
  rate_limit:
    enabled: true
    max: 100
    window: "1 minute"
    exclude_paths: ["/api/health", "/_health"]
  session:
    secure_cookie: false
    max_age_days: 30

otel:
  enabled: false
  service_name: "template-ui"

announcement:
  enabled: false
  message: ""
  type: "info"
