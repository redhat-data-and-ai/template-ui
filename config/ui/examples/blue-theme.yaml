# Example: Blue-themed agent with custom branding
branding:
  logo_url: "/custom-blue-logo.svg"
  title: "Blue Corp Agent"
  colors:
    light:
      primary: "#0000ff"
      accent: "#00ffff"
      background: "#ffffff"
      foreground: "#000000"
    dark:
      primary: "#4dabf7"
      accent: "#00cccc"
      background: "#001122"
      foreground: "#f0f0f0"

features:
  debug_mode_default: true   # Enable debug by default
  memory_enabled_default: true
  auth_enabled: true
