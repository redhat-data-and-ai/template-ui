branding:
  title: "Workpilot"
  version: "v1.0.0"
  logo_url: "https://cdn.prod.website-files.com/6447ad3a38d5f03bc4e0a3b2/69e9fcfe18543c02af4fde56_WorkPilot.jpg"
  favicon_url: "https://cdn.prod.website-files.com/6447ad3a38d5f03bc4e0a3b2/69e9fcfe18543c02af4fde56_WorkPilot.jpg"
  colors:
    light:
      primary: "#0066cc"
      accent: "#a60000"
      background: "#ffffff"
      foreground: "#1a1a1a"
    dark:
      primary: "#4dabf7"
      accent: "#f56e6e"
      background: "#0a1628"
      foreground: "#f0f4f8"

# Landing copy. `{agent}` and `{user}` are substituted at render time;
# `{user}` is empty when nobody is signed in, so greeting_anonymous is used.
content:
  greeting: "Hey {user}! 👋"
  greeting_anonymous: "Hey there! 👋"
  subtitle: "{agent} is ready to help. What would you like to explore today?"
  quick_prompts_heading: "Let's try some quick prompts 🚀"
  # Set to [] to drop the starter buttons entirely.
  quick_prompts:
    - "What can {agent} do for me?"
    - "Help me analyze a dataset"
    - "Write a query to find anomalies"
    - "Summarize the key findings from this data"
  input_placeholder: "Ask {agent} anything..."
  welcome_heading: "Welcome to {agent}!"
  welcome_subtitle: "How can I help you today?"

features:
  debug_mode_default: false
  # auth_enabled: Controlled via AUTH_ENABLED environment variable (set by agent-engine during deployment)
  mcp_apps_enabled: true
  memory_enabled: true

agent:
  endpoint: ""
  timeout_ms: 30000
  streaming: true

quick_prompts:
  - What can Agent do for me?
  - Help me analyze a dataset
  - Write a query to find anomalies
  - Summarize the key findings from this data

platform:
  opa:
    enabled: false
    policy_path: ""                        # Path to .rego policy directory (default: config/compliance/)
    fail_on_violation: false               # Block startup if policy violations are found
    approved_auth_providers: []            # e.g. ["oidc", "saml"] — empty = allow all
    internal_endpoint_suffixes: []         # e.g. [".internal.example.com", ".svc.cluster.local"]
    max_session_ttl_days: 0               # 0 = no limit
    restrict_debug_mode: false             # Deny debug_mode_default = true
    restricted_features: []                # Feature flag keys that must be false
    max_rate_limit: 0                      # 0 = no cap on rate_limit.max

security:
  rate_limit:
    enabled: true
    # A chat UI is chattier than a REST client: one load of the
    # analytics page is four calls, and streaming, thread-state
    # polling and uploads stack on top. 100/min tripped during
    # ordinary use, and a limit that fires on normal work trains
    # people to ignore the error.
    max: 600
    window: "1 minute"
    # Reverse-proxy hops to trust when reading the client address.
    # 0 trusts none. Without this, every request behind an OpenShift
    # Route carries the ingress pod's address and the whole
    # deployment shares one bucket — a per-user limit that is really
    # a per-cluster one. Not `true`: trusting the entire
    # X-Forwarded-For lets a caller prepend an address and mint a
    # fresh bucket per request.
    trust_proxy: 1
    exclude_paths:
      - "/api/health"
      - "/_health"
  session:
    secure_cookie: false
    max_age_days: 30
  helmet:
    enabled: true
    cross_origin_embedder_policy: false

server:
  host: "0.0.0.0"
  port: 8080
  body_limit: 1048576

logging:
  level: "info"

cors:
  origin: "http://localhost:5173"
