branding:
  title: "Deep Agent"
  logo_url: "/dist/frontend/redhat-logo.svg"
  favicon_url: "/dist/frontend/redhat-logo.svg"
  colors:
    light:
      primary: "#0066cc"
      accent: "#a60000"
      background: "#ffffff"
      foreground: "#1a1a1a"
    dark:
      primary: "#4dabf7"
      accent: "#f56e6e"
      background: "#0a1628"
      foreground: "#f0f4f8"

features:
  debug_mode_default: false
  # auth_enabled: Controlled via AUTH_ENABLED environment variable (set by agent-engine during deployment)

agent:
  endpoint: ""
  timeout_ms: 30000
  streaming: true



security:
  rate_limit:
    enabled: true
    max: 100
    window: "1 minute"
    exclude_paths:
      - "/api/health"
      - "/_health"
  session:
    secure_cookie: false
    max_age_days: 30
  helmet:
    enabled: true
    cross_origin_embedder_policy: false

server:
  host: "0.0.0.0"
  port: 8080
  body_limit: 1048576

logging:
  level: "info"

cors:
  origin: "http://localhost:5173"
