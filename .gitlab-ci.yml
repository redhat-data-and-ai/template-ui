stages:
  - lint
  - test
  - build
  - e2e

variables:
  NODE_VERSION: "22"

default:
  image: node:22-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

.install: &install
  before_script:
    - npm ci

lint:
  stage: lint
  <<: *install
  script:
    - npm run lint

unit-test:
  stage: test
  <<: *install
  script:
    - npm run test:run
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

build:
  stage: build
  <<: *install
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

e2e:
  stage: e2e
  # Use the Playwright image whose bundled browser channel matches @playwright/test ^1.61.x.
  # If the package version is bumped, update this tag accordingly.
  image: mcr.microsoft.com/playwright:v1.61.0-noble
  needs:
    - build
  variables:
    CI: "true"
  before_script:
    - npm ci
    # Reinstall browsers so the CLI version always matches the image channel.
    - npx playwright install chromium --with-deps
  script:
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 7 days
